<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141413"/>
      <stop offset="50%" stop-color="#1C1B1A"/>
      <stop offset="100%" stop-color="#0F0F0E"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#383531" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#141413" stop-opacity="0"/>
    </radialGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  
  <!-- Subtle border -->
  <rect x="32" y="32" width="1136" height="566" rx="24" fill="none" stroke="#2E2C29" stroke-width="2"/>
  
  <!-- Brand Mark -->
  <g transform="translate(100, 100)">
    <circle cx="28" cy="28" r="28" fill="#FBF9F5"/>
    <polygon points="23,19 38,28 23,37" fill="#1A1918"/>
  </g>
  <text x="175" y="136" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="600" fill="#FBF9F5" letter-spacing="-0.5">Curate</text>
  <text x="175" y="162" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#A8A29E" letter-spacing="2" text-transform="uppercase">CURATE YOUR CURIOSITY</text>
  
  <!-- Center Editorial Headline -->
  <text x="100" y="310" font-family="serif, Times New Roman, Georgia" font-size="68" font-style="italic" font-weight="400" fill="#FBF9F5">A thoughtfully planned week.</text>
  <text x="100" y="380" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="300" fill="#D6D3D1" letter-spacing="0.2">Articles, podcasts, videos, and books — scheduled with mindful intention.</text>
  
  <!-- Bottom Info Pills -->
  <g transform="translate(100, 470)">
    <rect x="0" y="0" width="160" height="42" rx="21" fill="#292724" stroke="#3D3A35" stroke-width="1"/>
    <text x="80" y="26" text-anchor="middle" font-family="monospace, monospace" font-size="14" fill="#E7E5E4">WEEKLY FLOW</text>
    
    <rect x="180" y="0" width="180" height="42" rx="21" fill="#292724" stroke="#3D3A35" stroke-width="1"/>
    <text x="270" y="26" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#A8A29E">TIME-BUDGETED</text>
  </g>
  
  <!-- Bottom Right Attribution -->
  <text x="1100" y="555" text-anchor="end" font-family="system-ui, sans-serif" font-size="16" font-weight="400" fill="#78716C">curate.app</text>
</svg>
